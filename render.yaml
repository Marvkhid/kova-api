# ============================================================
# KOVA API — Render Blueprint
# Deploy: Render Dashboard → New → Blueprint → pick Marvkhid/kova-api
# Render reads this file, creates the service, and prompts for the
# `sync: false` secrets. The NestJS app is at this repo's root.
# ============================================================
services:
  - type: web
    name: kova-api
    runtime: node
    plan: free # spins down when idle; first request takes ~50s
    branch: main
    # The app lives at the repo root (no monorepo rootDir).
    buildCommand: npm ci && npm run build
    # Schema is already migrated on the database (7/7 applied), so this
    # is a safe no-op that also keeps a fresh database in sync.
    startCommand: npx prisma migrate deploy && node dist/src/main.js
    healthCheckPath: /api/categories
    envVars:
      - key: NODE_ENV
        value: production
      # Public frontend URL — used for CORS and the Paystack callback
      - key: FRONTEND_URL
        value: https://kova-shopp.vercel.app
      # Same Postgres instance as local dev (Prisma pooled URL).
      # Products/categories/stores then match localhost exactly.
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: PAYSTACK_SECRET_KEY
        sync: false
      - key: PAYSTACK_PUBLIC_KEY
        sync: false
      - key: RESEND_API_KEY
        sync: false
      # resend.dev sender only delivers to the Resend account owner's
      # inbox — verify a domain to email real users.
      - key: FROM_EMAIL
        value: onboarding@resend.dev
      # Image uploads (seller product photos, shop logos)
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      # Optional: extra CORS origins, comma-separated
      # - key: EXTRA_ORIGINS
      #   value: https://staging.kova.example
